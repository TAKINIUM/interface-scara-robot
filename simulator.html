<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Scara GCode Simulator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
</head>
<body>
    <div class="toolbar">
        <input type="file" id="gcodeInput" accept=".gcode, .nc, .txt">
        <button id="btnBack" class="btn-config-purple" onclick="window.location.href='index2.html'">RETOUR</button>
    </div>
    
    <div class="sim-controls">
        <label>Vitesse Simulation: <span id="speedVal">1</span>x</label>
        <input type="range" id="speedSlider" min="1" max="50" value="1">
        <label>Crayon: <span id="brushVal">2</span> px</label>
        <input type="range" id="brushSlider" min="1" max="20" value="2">
        <button id="btnPlay" class="btn-config-green">PLAY</button>
        <button id="btnPause" class="btn-config-orange">PAUSE</button>
        <button id="btnReset" class="btn-config-red">RESET</button>
    </div>

    <div id="sim-canvas-container"></div>

    <script src="simulator.js"></script>
</body>
</html>
